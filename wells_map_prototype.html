<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каражанбас · Каталог скважин</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.12.0/maplibre-gl.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.12.0/maplibre-gl.js"></script>
<style>
  :root{
    --bg:#0b0d10; --panel:#14171c; --panel-2:#1b1f26; --border:#262b33;
    --text:#e7e9ec; --text-dim:#8a909b; --text-faint:#565c66;
    --accent:#d9a441; --accent-soft:#3a3120;
    --ok:#39d98a; --ok-soft:#123526;
    --review:#f0a63a; --review-soft:#3a2a10;
    --none:#5b6472; --none-soft:#22262d;
    --danger:#ef5350;
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-sans);
    overflow:hidden;
  }
  #map{position:absolute; inset:0;}
  #map .maplibregl-canvas{
    filter:grayscale(.35) brightness(.5) contrast(1.18) invert(.92) hue-rotate(180deg);
  }
  #map .maplibregl-ctrl-attrib{
    background:rgba(11,13,16,.75); color:var(--text-faint); font-size:10px;
  }
  #map .maplibregl-ctrl-attrib a{color:var(--text-dim);}
  #map .maplibregl-ctrl-group{
    background:var(--panel); border:1px solid var(--border); box-shadow:none;
  }
  #map .maplibregl-ctrl-group button{filter:invert(1);}
  #map .maplibregl-ctrl-group button+button{border-top:1px solid var(--border);}

  a{color:var(--accent);}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .cluster-label{
    font-family:var(--font-mono); font-weight:700; font-size:12px;
    color:#0b0d10; pointer-events:none; user-select:none;
    text-align:center; white-space:nowrap;
  }

  /* ---------- top bar ---------- */
  #topbar{
    position:absolute; top:0; left:0; right:0; z-index:5;
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    padding:14px 16px; pointer-events:none;
  }
  .glass{
    background:rgba(20,23,28,.82); backdrop-filter:blur(10px);
    border:1px solid var(--border); border-radius:var(--radius);
  }
  #titleblock{padding:10px 14px; pointer-events:auto; max-width:min(72vw,440px);}
  #titleblock h1{
    margin:0; font-size:15px; font-weight:650; letter-spacing:.01em; line-height:1.25;
  }
  #titleblock .sub{
    margin-top:3px; font-size:11.5px; color:var(--text-dim); line-height:1.4;
  }
  #provenance{
    display:inline-flex; align-items:center; gap:5px; margin-top:7px;
    font-family:var(--font-mono); font-size:10px; color:var(--accent);
    background:var(--accent-soft); border:1px solid #4a3c22;
    padding:3px 7px; border-radius:6px;
  }
  #provenance .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);}

  #stats{
    display:flex; gap:8px; pointer-events:auto; flex-wrap:wrap; justify-content:flex-end;
  }
  .chip{
    padding:8px 12px; min-width:64px; text-align:right;
  }
  .chip .n{font-family:var(--font-mono); font-size:17px; font-weight:600; line-height:1;}
  .chip .l{font-size:9.5px; color:var(--text-dim); margin-top:3px; letter-spacing:.03em; text-transform:uppercase;}
  .chip.ok .n{color:var(--ok);}
  .chip.review .n{color:var(--review);}
  .chip.none .n{color:var(--none);}

  /* ---------- bottom-left HUD ---------- */
  #hud{
    position:absolute; left:16px; bottom:16px; z-index:5;
    font-family:var(--font-mono); font-size:10.5px; color:var(--text-dim);
    padding:7px 10px; pointer-events:none; line-height:1.6;
  }
  #hud b{color:var(--text);}

  /* ---------- legend ---------- */
  #legend{
    position:absolute; right:16px; bottom:16px; z-index:5;
    padding:10px 12px; font-size:11px; color:var(--text-dim); pointer-events:auto;
  }
  #legend .row{display:flex; align-items:center; gap:7px; margin:3px 0;}
  #legend .sw{width:9px;height:9px;border-radius:50%; flex:none;}

  /* ---------- search ---------- */
  #searchwrap{
    position:absolute; z-index:6; pointer-events:auto;
  }
  #searchbox{
    width:230px; padding:9px 12px; border-radius:var(--radius);
    background:rgba(20,23,28,.92); border:1px solid var(--border); color:var(--text);
    font-size:13px; outline:none;
  }
  #searchbox::placeholder{color:var(--text-faint);}
  #searchbox:focus{border-color:var(--accent);}
  #results{
    margin-top:6px; max-height:260px; overflow-y:auto;
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    display:none;
  }
  #results.show{display:block;}
  .result{
    padding:8px 12px; font-size:12.5px; cursor:pointer; display:flex;
    justify-content:space-between; gap:8px; border-bottom:1px solid var(--border);
  }
  .result:last-child{border-bottom:none;}
  .result:hover, .result:focus-visible{background:var(--panel-2);}
  .result .rn{font-family:var(--font-mono); color:var(--text);}
  .result .rl{color:var(--text-faint); font-size:10.5px;}

  /* ---------- side / sheet panel ---------- */
  #panel{
    position:absolute; z-index:8;
    background:var(--panel); border:1px solid var(--border);
    display:flex; flex-direction:column; overflow:hidden;
  }
  #panelHead{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 14px; border-bottom:1px solid var(--border); flex:none;
  }
  #panelHead h2{margin:0; font-size:13.5px; font-weight:650;}
  #panelClose{
    background:none; border:none; color:var(--text-dim); font-size:18px;
    cursor:pointer; line-height:1; padding:2px 6px;
  }
  #panelBody{padding:14px; overflow-y:auto; flex:1;}

  .mode-toggle{
    display:flex; gap:6px; padding:12px 14px 0;
  }
  .mode-btn{
    flex:1; padding:8px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text-dim); font-size:11.5px; cursor:pointer;
    text-align:center; font-weight:600; letter-spacing:.02em;
  }
  .mode-btn.active{background:var(--accent-soft); border-color:#4a3c22; color:var(--accent);}

  .about{
    font-size:11.5px; color:var(--text-dim); line-height:1.6;
    background:var(--panel-2); border:1px solid var(--border);
    border-radius:8px; padding:10px 12px; margin-top:6px;
  }
  .about b{color:var(--text);}

  .status-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:11px;
    padding:3px 9px; border-radius:20px; font-weight:600;
  }
  .status-badge.ok{background:var(--ok-soft); color:var(--ok);}
  .status-badge.review{background:var(--review-soft); color:var(--review);}
  .status-badge.none{background:var(--none-soft); color:var(--none);}

  .detail-title{font-family:var(--font-mono); font-size:19px; font-weight:700; margin:2px 0 8px;}
  .kv{display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--border); font-size:12.5px;}
  .kv:last-of-type{border-bottom:none;}
  .kv .k{color:var(--text-dim);}
  .kv .v{font-family:var(--font-mono); text-align:right;}

  .actions{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .btn{
    flex:1; min-width:100px; padding:10px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); font-size:12.5px; font-weight:600;
    cursor:pointer; text-align:center;
  }
  .btn.confirm{background:var(--ok-soft); border-color:#1c5c40; color:var(--ok);}
  .btn.reject{background:#3a1f1e; border-color:#5c2725; color:var(--danger);}
  .btn.ghost{background:transparent;}
  .btn.wide{flex-basis:100%;}
  .btn:disabled{opacity:.4; cursor:default;}

  .progress{font-size:11px; color:var(--text-dim); margin-top:12px; text-align:center;}
  .empty-state{text-align:center; padding:24px 10px; color:var(--text-dim); font-size:12.5px; line-height:1.6;}
  .empty-state .big{font-size:26px; margin-bottom:6px;}

  /* desktop layout */
  #searchwrap{ top:88px; right:16px; }
  #panel{ top:88px; right:16px; bottom:16px; width:320px; border-radius:var(--radius); }

  @media (max-width:720px){
    #titleblock{max-width:60vw; padding:8px 11px;}
    #titleblock h1{font-size:12.5px;}
    #titleblock .sub{display:none;}
    #provenance{font-size:9px; margin-top:5px; padding:2px 6px;}
    .chip{padding:6px 9px; min-width:48px;}
    .chip .n{font-size:14px;}
    .chip .l{font-size:8px;}
    #legend{display:none;}
    #hud{font-size:9px; bottom:12px;}
    #searchwrap{ left:12px; right:12px; top:auto; bottom:12px; width:auto; }
    #results{max-height:38vh;}
    #panel{
      left:0; right:0; bottom:0; top:auto; width:auto;
      max-height:72vh; border-radius:16px 16px 0 0; border-bottom:none;
    }
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <div id="titleblock" class="glass">
    <h1>Каражанбас · Каталог скважин</h1>
    <div class="sub">Слой 1 — справочник объектов для системы нарядов-допусков</div>
    <div id="provenance"><span class="dot"></span>СК‑42 (EPSG:28409) → WGS84 · Приказ №344</div>
  </div>
  <div id="stats">
    <div class="chip glass ok"><div class="n" id="statOk">–</div><div class="l">подтв.</div></div>
    <div class="chip glass review"><div class="n" id="statReview">–</div><div class="l">на провер.</div></div>
    <div class="chip glass none"><div class="n" id="statTotal">–</div><div class="l">всего</div></div>
  </div>
</div>

<div id="hud">

  <div>zoom <b id="hudZoom">—</b></div>
</div>

<div id="legend" class="glass">
  <div class="row"><span class="sw" style="background:var(--ok)"></span>подтверждена</div>
  <div class="row"><span class="sw" style="background:var(--review)"></span>требует проверки</div>
  <div class="row"><span class="sw" style="background:var(--none)"></span>без номера</div>
</div>

<div id="searchwrap">
  <input id="searchbox" type="text" placeholder="Найти скважину, напр. T112…" autocomplete="off">
  <div id="results"></div>
</div>

<div id="panel" class="glass">
  <div id="panelHead">
    <h2 id="panelTitle">О каталоге</h2>
    <button id="panelClose" aria-label="Свернуть" title="Свернуть">–</button>
  </div>
  <div class="mode-toggle">
    <button class="mode-btn active" id="modeBrowse">Обзор</button>
    <button class="mode-btn" id="modeReview">Режим проверки</button>
  </div>
  <div id="panelBody"><div class="empty-state">Загрузка каталога…</div></div>
</div>

<script>
(function(){
  const COLOR_OK = '#39d98a';
  const COLOR_REVIEW = '#f0a63a';
  const COLOR_NONE = '#5b6472';

  const wellsData = JSON.parse(document.getElementById('wells-data-holder').textContent);
  const allFeatures = wellsData.features;

  // ---- bounds ----
  let minLon=Infinity, minLat=Infinity, maxLon=-Infinity, maxLat=-Infinity;
  for (const f of allFeatures){
    const [lon,lat] = f.geometry.coordinates;
    if(lon<minLon)minLon=lon; if(lon>maxLon)maxLon=lon;
    if(lat<minLat)minLat=lat; if(lat>maxLat)maxLat=lat;
  }

  // ---- stats ----
  const totalCount = allFeatures.length;
  const reviewCount = allFeatures.filter(f=>f.properties.needs_review).length;
  const okCount = totalCount - reviewCount;
  document.getElementById('statOk').textContent = okCount;
  document.getElementById('statReview').textContent = reviewCount;
  document.getElementById('statTotal').textContent = totalCount;

  // ---- persistent review decisions ----
  let reviewMap = {};
  const STORAGE_KEY = 'well-reviews';
  const hasStorage = typeof window.storage !== 'undefined' && window.storage;

  async function loadReviewMap(){
    if(!hasStorage) return;
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value) reviewMap = JSON.parse(res.value);
    }catch(e){ reviewMap = {}; }
  }
  async function saveReviewMap(){
    if(!hasStorage) return;
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(reviewMap), false); }
    catch(e){ console.error('storage save failed', e); }
  }

  // ---- map init ----
  const map = new maplibregl.Map({
    container:'map',
    style:{ version:8, sources:{}, layers:[
      { id:'bg', type:'background', paint:{'background-color':'#e7e5df'} }
    ]},
    center:[(minLon+maxLon)/2, (minLat+maxLat)/2],
    zoom:9,
    attributionControl:false
  });
  map.addControl(new maplibregl.AttributionControl({compact:true, customAttribution:'Основа: OpenStreetMap · Скважины: DWG-схема, СК‑42→WGS84'}));
  map.addControl(new maplibregl.NavigationControl({showCompass:false}), 'top-right');

  map.on('mousemove', e=>{
    document.getElementById('hudCoord').textContent = e.lngLat.lat.toFixed(5)+', '+e.lngLat.lng.toFixed(5);
  });
  map.on('zoom', ()=>{ document.getElementById('hudZoom').textContent = map.getZoom().toFixed(1); });

  let clusterMarkers = new Map();
  function updateClusterMarkers(){
    const feats = map.querySourceFeatures('wells', {filter:['has','point_count']});
    const seen = new Set(), active = new Set();
    for(const f of feats){
      const id = f.properties.cluster_id;
      if(seen.has(id)) continue;
      seen.add(id); active.add(id);
      let m = clusterMarkers.get(id);
      if(!m){
        const el = document.createElement('div');
        el.className='cluster-label';
        el.style.pointerEvents='none';
        m = new maplibregl.Marker({element:el}).setLngLat(f.geometry.coordinates).addTo(map);
        clusterMarkers.set(id, m);
      } else {
        m.setLngLat(f.geometry.coordinates);
      }
      const c = f.properties.point_count;
      m.getElement().textContent = c>999 ? Math.round(c/1000)+'k' : c;
    }
    for(const [id,m] of clusterMarkers){
      if(!active.has(id)){ m.remove(); clusterMarkers.delete(id); }
    }
  }

  map.on('load', ()=>{
    map.addSource('osm', {
      type:'raster',
      tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
      tileSize:256,
      attribution:'© OpenStreetMap contributors'
    });
    map.addLayer({id:'osm', type:'raster', source:'osm', paint:{'raster-opacity':1}});

    map.addSource('wells', {
      type:'geojson', data: wellsData, cluster:true, clusterMaxZoom:13, clusterRadius:48, promoteId:'id'
    });

    map.addLayer({
      id:'clusters', type:'circle', source:'wells', filter:['has','point_count'],
      paint:{
        'circle-color':['step',['get','point_count'], '#3a4a5a', 10, '#d9a441', 50, '#e8873a'],
        'circle-radius':['step',['get','point_count'], 14, 10, 18, 50, 24],
        'circle-stroke-width':2,
        'circle-stroke-color':'rgba(255,255,255,0.18)'
      }
    });

    map.addLayer({
      id:'wells-unclustered', type:'circle', source:'wells', filter:['!',['has','point_count']],
      paint:{
        'circle-radius':['interpolate',['linear'],['zoom'], 8,3, 12,5, 16,8],
        'circle-color':['case',
          ['==',['get','well_no'], null], COLOR_NONE,
          ['get','needs_review'], COLOR_REVIEW,
          COLOR_OK
        ],
        'circle-stroke-width':['case',['boolean',['feature-state','resolved'],false], 2.5, 1.1],
        'circle-stroke-color':['case',['boolean',['feature-state','resolved'],false], '#ffffff', '#0b0d10']
      }
    });

    map.fitBounds([[minLon,minLat],[maxLon,maxLat]], {padding:70, duration:0});

    map.on('click','clusters', async (e)=>{
      const f = e.features[0];
      const clusterId = f.properties.cluster_id;
      const src = map.getSource('wells');
      try{
        const zoom = await src.getClusterExpansionZoom(clusterId);
        map.easeTo({center:f.geometry.coordinates, zoom});
      }catch(err){}
    });
    map.on('click','wells-unclustered', (e)=>{ openDetail(e.features[0].properties); });

    ['clusters','wells-unclustered'].forEach(id=>{
      map.on('mouseenter', id, ()=> map.getCanvas().style.cursor='pointer');
      map.on('mouseleave', id, ()=> map.getCanvas().style.cursor='');
    });

    map.on('idle', updateClusterMarkers);

    loadReviewMap().then(()=>{
      applyResolvedStates();
      renderBrowsePanel();
    });
  });

  function applyResolvedStates(){
    for(const f of allFeatures){
      const id = f.properties.id;
      if(reviewMap[id]){
        try{ map.setFeatureState({source:'wells', id}, {resolved:true}); }catch(e){}
      }
    }
  }

  // ---------------- search ----------------
  const searchbox = document.getElementById('searchbox');
  const resultsEl = document.getElementById('results');
  searchbox.addEventListener('input', ()=>{
    const q = searchbox.value.trim().toUpperCase();
    if(q.length<1){ resultsEl.classList.remove('show'); resultsEl.innerHTML=''; return; }
    const matches = allFeatures.filter(f=>{
      const wn = f.properties.well_no;
      return wn && wn.toUpperCase().includes(q);
    }).slice(0,8);
    if(!matches.length){
      resultsEl.innerHTML = '<div class="result"><span class="rl">Ничего не найдено</span></div>';
      resultsEl.classList.add('show');
      return;
    }
    resultsEl.innerHTML = matches.map(f=>
      `<div class="result" tabindex="0" data-id="${f.properties.id}">
        <span class="rn">${escapeHtml(f.properties.well_no)}</span>
        <span class="rl">${escapeHtml(f.properties.layer||'')}</span>
      </div>`
    ).join('');
    resultsEl.classList.add('show');
  });
  resultsEl.addEventListener('click', (e)=>{
    const row = e.target.closest('.result[data-id]');
    if(!row) return;
    const f = allFeatures.find(x=>String(x.properties.id)===row.dataset.id);
    if(f) flyToWell(f);
    resultsEl.classList.remove('show');
    searchbox.value = f ? f.properties.well_no : '';
  });

  function flyToWell(f){
    map.flyTo({center:f.geometry.coordinates, zoom:15, duration:900});
    openDetail(f.properties);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------------- panel: browse / detail / review ----------------
  const panel = document.getElementById('panel');
  const panelTitle = document.getElementById('panelTitle');
  const panelBody = document.getElementById('panelBody');
  const modeBrowseBtn = document.getElementById('modeBrowse');
  const modeReviewBtn = document.getElementById('modeReview');
  const panelClose = document.getElementById('panelClose');

  let panelCollapsed = false;
  panelClose.addEventListener('click', ()=>{
    panelCollapsed = !panelCollapsed;
    panelBody.style.display = panelCollapsed ? 'none' : '';
    document.querySelector('.mode-toggle').style.display = panelCollapsed ? 'none' : '';
    panelClose.textContent = panelCollapsed ? '+' : '–';
  });

  let reviewQueue = [];
  let reviewIdx = 0;
  let currentMode = 'browse';

  function setMode(mode){
    currentMode = mode;
    modeBrowseBtn.classList.toggle('active', mode==='browse');
    modeReviewBtn.classList.toggle('active', mode==='review');
    if(mode==='browse') renderBrowsePanel();
    else startReview();
  }
  modeBrowseBtn.addEventListener('click', ()=>setMode('browse'));
  modeReviewBtn.addEventListener('click', ()=>setMode('review'));

  function renderBrowsePanel(){
    panelTitle.textContent = 'О каталоге';
    const remaining = allFeatures.filter(f=>f.properties.needs_review && !reviewMap[f.properties.id]).length;
    panelBody.innerHTML = `
      <div class="about">
        Точки скважин извлечены из DWG‑схемы (СК‑42, зона 9 / EPSG:28409) и
        пересчитаны в WGS84. Номер скважины определялся по ближайшей
        текстовой подписи в исходном чертеже — не всегда однозначно.
        <br><br>
        <b>${remaining}</b> из ${reviewCount} точек ещё ждут подтверждения.
        Переключитесь на «Режим проверки», чтобы пройти по ним по очереди.
      </div>
      <div class="kv"><span class="k">Всего точек</span><span class="v">${totalCount}</span></div>
      <div class="kv"><span class="k">Подтверждено</span><span class="v">${okCount}</span></div>
      <div class="kv"><span class="k">На проверке</span><span class="v">${reviewCount}</span></div>
      <div class="kv"><span class="k">Проверено вами</span><span class="v">${Object.keys(reviewMap).length}</span></div>
      <div style="margin-top:14px; font-size:11px; color:var(--text-faint); line-height:1.6;">
        Кликните по точке на карте, чтобы посмотреть её данные.
      </div>
    `;
  }

  function openDetail(props){
    setMode('detail-single');
    renderDetail(props, {standalone:true});
  }

  function renderDetail(props, opts){
    opts = opts || {};
    const status = props.well_no==null ? 'none' : (props.needs_review ? 'review' : 'ok');
    const statusLabel = {ok:'Подтверждена', review:'Требует проверки', none:'Без номера'}[status];
    const resolved = !!reviewMap[props.id];

    panelTitle.textContent = opts.standalone ? 'Скважина' : `Проверка ${reviewIdx+1} / ${reviewQueue.length}`;
    panelBody.innerHTML = `
      <span class="status-badge ${status}">${statusLabel}${resolved?' · сохранено':''}</span>
      <div class="detail-title">${props.well_no ? escapeHtml(props.well_no) : '— без номера —'}</div>
      <div class="kv"><span class="k">Слой / этап</span><span class="v">${escapeHtml(props.layer||'—')}</span></div>
      <div class="kv"><span class="k">Координаты</span><span class="v">${props.__lat.toFixed(6)}, ${props.__lon.toFixed(6)}</span></div>
      <div class="kv"><span class="k">До подписи</span><span class="v">${props.label_dist!=null ? props.label_dist+' ед.' : '—'}</span></div>
      <div class="actions">
        ${status!=='ok' ? `
          <button class="btn confirm" id="btnConfirm">✓ Верно</button>
          <button class="btn reject" id="btnReject">✕ Ошибка</button>
        ` : ''}
        <button class="btn ghost wide" id="btnGmaps">Открыть в Google Maps ↗</button>
        ${!opts.standalone ? `<button class="btn wide" id="btnSkip">Пропустить →</button>` : ''}
      </div>
      ${!opts.standalone ? `<div class="progress">Осталось: ${reviewQueue.length - reviewIdx - 1}</div>` : ''}
    `;

    const gmaps = document.getElementById('btnGmaps');
    if(gmaps) gmaps.addEventListener('click', ()=>{
      window.open(`https://www.google.com/maps?q=${props.__lat},${props.__lon}`, '_blank', 'noopener');
    });
    const confirmBtn = document.getElementById('btnConfirm');
    if(confirmBtn) confirmBtn.addEventListener('click', ()=> resolveWell(props, 'confirmed', opts));
    const rejectBtn = document.getElementById('btnReject');
    if(rejectBtn) rejectBtn.addEventListener('click', ()=> resolveWell(props, 'rejected', opts));
    const skipBtn = document.getElementById('btnSkip');
    if(skipBtn) skipBtn.addEventListener('click', ()=> advanceReview());
  }

  async function resolveWell(props, decision, opts){
    reviewMap[props.id] = {status:decision, ts:Date.now()};
    await saveReviewMap();
    try{ map.setFeatureState({source:'wells', id:props.id}, {resolved:true}); }catch(e){}
    if(opts.standalone){
      renderDetail(props, opts); // refresh badge to show "сохранено"
    } else {
      advanceReview();
    }
  }

  function startReview(){
    reviewQueue = allFeatures.filter(f=>f.properties.needs_review && !reviewMap[f.properties.id]);
    reviewIdx = 0;
    if(!reviewQueue.length){
      panelTitle.textContent = 'Режим проверки';
      panelBody.innerHTML = `<div class="empty-state"><div class="big">✓</div>Все спорные точки проверены.<br>Можно вернуться к обзору.</div>`;
      return;
    }
    showReviewCurrent();
  }

  function showReviewCurrent(){
    const f = reviewQueue[reviewIdx];
    const props = {...f.properties, __lon:f.geometry.coordinates[0], __lat:f.geometry.coordinates[1]};
    map.flyTo({center:f.geometry.coordinates, zoom:15.5, duration:700});
    renderDetail(props, {standalone:false});
  }

  function advanceReview(){
    reviewQueue = allFeatures.filter(f=>f.properties.needs_review && !reviewMap[f.properties.id]);
    if(!reviewQueue.length){ startReview(); return; }
    if(reviewIdx >= reviewQueue.length) reviewIdx = 0;
    showReviewCurrent();
  }

  // wrap openDetail to attach lon/lat for standalone map clicks
  const _openDetail = openDetail;
  openDetail = function(props){
    const f = allFeatures.find(x=>x.properties.id===props.id);
    const full = {...props, __lon:f.geometry.coordinates[0], __lat:f.geometry.coordinates[1]};
    setMode('detail-single');
    renderDetail(full, {standalone:true});
  };
})();
</script>
</body>
</html>
