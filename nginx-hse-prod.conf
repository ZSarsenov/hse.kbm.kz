# Nginx конфигурация: prod на порту 80, dev на порту 8080
# Разместить: /etc/nginx/sites-available/nginx-hse-prod

# --- PROD (основной порт :80 для пользователей) ---
server {
    listen 80;
    server_name 10.108.2.38 _;

    client_max_body_size 50M;

    # Фронтенд PROD
    location / {
        root /home/sadmin/web/prod/frontend/dist;
        try_files $uri /index.html;
    }

    # Django PROD API
    location /api/ {
        proxy_pass http://unix:/home/sadmin/web/prod/hse_project.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django PROD admin
    location /admin/ {
        proxy_pass http://unix:/home/sadmin/web/prod/hse_project.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статика PROD
    location /static/ {
        alias /home/sadmin/web/prod/staticfiles/;
    }

    # Media PROD
    location /permits_scans/ {
        alias /home/sadmin/web/prod/permits_scans/;
    }
}

# --- DEV (порт :8080 для разработки) ---
server {
    listen 8080;
    server_name 10.108.2.38 _;

    client_max_body_size 50M;

    # Фронтенд DEV
